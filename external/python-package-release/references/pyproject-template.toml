# Template: PEP 621 pyproject.toml for src-layout Python packages
# Replace ALL placeholders: <PKG>, <VERSION>, <DESC>, <README>, <AUTHOR>, <EMAIL>, <GIT_REPO>
# Adjust deps and optional groups based on actual imports, not requirements.txt

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "<PKG>"
version = "<VERSION>"
description = "<DESC>"
readme = "<README>"
license = {text = "MIT"}
authors = [
    {name = "<AUTHOR>", email = "<EMAIL>"},
]
requires-python = ">=3.10"
keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # --- Runtime dependencies extracted from import analysis ---
    # "aiohttp>=3.9.0",
    # "python-dotenv>=1.0.0",
    # ...add all required imports here
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "isort>=5.12.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/<GIT_REPO>"
Repository = "https://github.com/<GIT_REPO>"
Issues = "https://github.com/<GIT_REPO>/issues"

[project.scripts]
# <cli-name> = "<PKG>.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
<PKG> = [
    "*.json",
    "*.yaml",
    "*.yml",
    "*.cfg",
    "*.ini",
    "*.env.example",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["<PKG>"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["<PKG>"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
